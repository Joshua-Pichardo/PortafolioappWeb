<!DOCTYPE html>
<html>

    <body>
        <h2>The list-style-type Property</h2>
        <p>Example of unordered lists:</p>
        <ul style="list-style-type: circle;">
            <li>Coffee</li>
            <li>Tea</li>
            <li>Coca Cola</li>
        </ul>

        <ul  style="list-style-type: disc;">
            <li>Coffee</li>
            <li>Tea</li>
            <li>Coca Cola</li>
        </ul>

        <ul style="list-style-type: square;">
            <li>Coffee</li>
            <li>Tea</li>
            <li>Coca Cola</li>
        </ul>
        <footer>Josue Joshua Pichardo Hernandez - 189738</footer>
    </body>
</html>
