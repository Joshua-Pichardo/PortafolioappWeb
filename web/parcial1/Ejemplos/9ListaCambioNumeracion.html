<!DOCTYPE html>
<html>

    <body>
        <h2>The list-style-type Property</h2>

        <p>Example of unordered lists:</p>
        <ol style="list-style-type: upper-roman;">
            <li>Coffee</li>
            <li>Tea</li>
            <li>Coca Cola</li>
        </ol>

        <ol  style="list-style-type:lower-alpha;">
            <li>Coffee</li>
            <li>Tea</li>
            <li>Coca Cola</li>
        </ol>

        <ol style="list-style-type: lower-roman;">
            <li>Coffee</li>
            <li>Tea</li>
            <li>Coca Cola</li>
        </ol>
        <footer>Josue Joshua Pichardo Hernandez - 189738</footer>
    </body>
</html>
