<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
  <style>
    /* Cambia el color de las viñetas de una lista específica */
    ul.red-bullets li::marker {
      color: red;
    }

    ul.blue-bullets li::marker {
      color: #007bff;
    }
   
  </style>
</head>
<body>

  <h2>Listas con viñetas de colores</h2>

  <ul class="red-bullets">
    <li>Coffee</li>
    <li>Tea</li>
    <li>Coca Cola</li>
  </ul>

  <ul class="blue-bullets">
    <li>Coffee</li>
    <li>Tea</li>
    <li>Coca Cola</li>
  </ul>
  <footer>Josue Joshua Pichardo Hernandez - 189738</footer>

</body>
</html>
